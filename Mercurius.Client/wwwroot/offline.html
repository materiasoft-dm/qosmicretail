<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <title>Offline · Mercurius</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
        /* Shown by the service worker only when this device has no connection AND hasn't saved any
           page of the app yet (normally the last-seen page opens instead). Self-contained: no
           external fonts or styles, since there's no connection to load them. */
        html, body { margin: 0; height: 100%; }
        body {
            display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #0c0a09;
            background: radial-gradient(circle at 80% 0%, #e6f8f0 0%, transparent 45%), linear-gradient(180deg, #f5f5f4 0%, #ffffff 100%);
        }
        main { max-width: 420px; text-align: center; }
        .mark {
            width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 28px; color: #fff; background: linear-gradient(135deg, #10b981, #047857);
            box-shadow: 0 10px 24px rgba(5, 150, 105, .28);
        }
        h1 { font-size: 24px; margin: 0 0 8px; }
        p { color: #44403c; line-height: 1.55; margin: 0 0 12px; }
        .muted { color: #78716c; font-size: 14px; }
        button {
            margin-top: 12px; height: 44px; padding: 0 22px; border: 0; border-radius: 8px; cursor: pointer;
            background: #10b981; color: #fff; font-size: 15px; font-weight: 600;
        }
        button:hover { background: #059669; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">M</div>
        <h1>You're offline</h1>
        <p>Mercurius needs a connection the first time it opens on this computer. Once you've signed in here, it opens and lets you keep selling even without a connection.</p>
        <p class="muted">Anything already saved on this computer is safe and is sent automatically when the connection is back.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
